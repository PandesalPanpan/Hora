name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          test -s .env.example
          cp .env.example .env
          node <<'NODE'
          const fs = require('node:fs')
          const services = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'))
          const packages = (services.client ?? []).map((client) => client.client_info?.android_client_info?.package_name)
          if (!packages.includes('com.izatime.tracker')) {
            throw new Error('google-services.json does not contain com.izatime.tracker')
          }
          const env = Object.fromEntries(fs.readFileSync('.env', 'utf8').split(/\r?\n/).filter((line) => line && !line.startsWith('#')).map((line) => {
            const separator = line.indexOf('=')
            return [line.slice(0, separator), line.slice(separator + 1)]
          }))
          for (const key of ['VITE_FIREBASE_API_KEY', 'VITE_FIREBASE_AUTH_DOMAIN', 'VITE_FIREBASE_PROJECT_ID', 'VITE_FIREBASE_STORAGE_BUCKET', 'VITE_FIREBASE_MESSAGING_SENDER_ID', 'VITE_FIREBASE_APP_ID']) {
            if (!env[key]) throw new Error(`Missing ${key} from .env.example`)
          }
          console.log('Firebase client configuration is present for the web bundle and com.izatime.tracker.')
          NODE

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} must match package.json version v${version}." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build web assets
        run: npm run build

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/iza-release.p12"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          if [[ ! -s "${keystore}" ]]; then
            echo 'The decoded release keystore is empty.' >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/release/app-release.apk'
          if [[ ! -s "${apk}" ]]; then
            echo "Signed APK was not produced at ${apk}." >&2
            exit 1
          fi
          sha256="$(sha256sum "${apk}" | cut -d ' ' -f1)"
          node scripts/create-update-manifest.mjs \
            --output "${RUNNER_TEMP}/update.json" \
            --apk app-release.apk \
            --sha256 "${sha256}"
          cp "${apk}" "${RUNNER_TEMP}/app-release.apk"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          apksigner="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          "${apksigner}" verify --verbose "${RUNNER_TEMP}/app-release.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="docs/release-notes/${{ steps.version.outputs.tag }}.md"
          release_args=(
            "${{ steps.version.outputs.tag }}"
            "${RUNNER_TEMP}/app-release.apk#app-release.apk"
            "${RUNNER_TEMP}/update.json#update.json"
            --title "Iza ${{ steps.version.outputs.version }}"
          )
          if [[ -f "${notes_file}" ]]; then
            release_args+=(--notes-file "${notes_file}")
          else
            release_args+=(--generate-notes)
          fi
          gh release create "${release_args[@]}"
