name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify web and Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Firebase client configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          cp .env.example .env

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build web assets
        run: npm run build

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
